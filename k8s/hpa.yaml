apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tts-backend-hpa
  namespace: tts-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tts-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30
