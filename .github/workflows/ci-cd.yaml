name: CI/CD - Build, Push, Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-cd.yaml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC -> AWS role assumption (no static keys)
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: tts-app-backend
  ECS_CLUSTER: tts-app-cluster
  ECS_SERVICE: tts-app-service
  ECS_TASK_FAMILY: tts-app-backend
  CONTAINER_NAME: backend
  IMAGE_RETENTION_COUNT: 5

jobs:
  # ---------------------------------------------------------------
  # BUILD STAGE: unit/integration tests, then build (but don't push yet)
  # ---------------------------------------------------------------
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run unit + integration tests
        working-directory: backend
        run: pytest tests/ -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/test-results.xml

      - name: Build image (validation only, not pushed)
        working-directory: backend
        run: docker build -t tts-app-backend:ci-check .

  # ---------------------------------------------------------------
  # PUSH STAGE: build for real, tag with git SHA + latest, push to ECR,
  # then prune everything except the newest N images
  # ---------------------------------------------------------------
  push:
    name: Push to ECR
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC - no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        working-directory: backend
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
                        -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Prune ECR - keep only the newest N images
        env:
          RETAIN: ${{ env.IMAGE_RETENTION_COUNT }}
        run: |
          # Belt-and-suspenders alongside the Terraform lifecycle policy: list images
          # newest-first, skip the first $RETAIN, delete the rest by digest.
          IMAGE_IDS=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --query 'sort_by(imageDetails,& imagePushedAt)[*].imageDigest' \
            --output text)

          TOTAL=$(echo "$IMAGE_IDS" | wc -w)
          EXCESS=$((TOTAL - RETAIN))

          if [ "$EXCESS" -gt 0 ]; then
            OLD_DIGESTS=$(echo "$IMAGE_IDS" | tr '\t' '\n' | head -n "$EXCESS")
            for digest in $OLD_DIGESTS; do
              echo "Deleting old image: $digest"
              aws ecr batch-delete-image \
                --repository-name "$ECR_REPOSITORY" \
                --image-ids imageDigest="$digest"
            done
          else
            echo "Only $TOTAL image(s) present, nothing to prune (retention: $RETAIN)."
          fi

  # ---------------------------------------------------------------
  # DEPLOY STAGE: register a new task def revision pointing at the new
  # image, update the ECS service, wait for it to stabilize
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to ECS
    needs: push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Render new image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.push.outputs.image_tag && format('{0}:{1}', secrets.ECR_REGISTRY, needs.push.outputs.image_tag) }}

      - name: Deploy new task definition to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # ---------------------------------------------------------------
  # TESTING STAGE: smoke test the freshly deployed service
  # ---------------------------------------------------------------
  smoke-test:
    name: Post-deploy smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Hit /health on the live ALB
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_URL }}/health")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i: got $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after deploy."
          exit 1

      - name: Verify /voices responds
        run: |
          curl -sf "${{ secrets.APP_URL }}/voices" | grep -q "en-us"
