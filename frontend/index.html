<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text to Speech</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1>Text&nbsp;→&nbsp;Speech</h1>
      <p class="app__subtitle">Type text, pick a voice, preview it, then save the .mp3</p>
    </header>

    <main class="card">
      <label for="text-input" class="field-label">Your text</label>
      <textarea
        id="text-input"
        maxlength="5000"
        placeholder="Type or paste the text you want converted to speech..."
      ></textarea>
      <div class="char-count"><span id="char-count">0</span> / 5000</div>

      <div class="controls-row">
        <div class="field">
          <label for="voice-select" class="field-label">Voice</label>
          <select id="voice-select"></select>
        </div>

        <div class="field-buttons">
          <button id="preview-btn" class="btn btn--secondary" type="button">
            ▶ Preview
          </button>
          <button id="convert-btn" class="btn btn--primary" type="button">
            Convert to MP3
          </button>
        </div>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <div id="player-wrap" class="player-wrap hidden">
        <audio id="audio-player" controls></audio>
        <a id="download-link" class="btn btn--primary" download>⬇ Save .mp3</a>
      </div>
    </main>

    <footer class="app__footer">
      <span id="api-status">checking API…</span>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
